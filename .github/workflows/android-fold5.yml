name: Android Fold5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-fold5/**"
      - "independent_learning_features.py"
      - "lineup_from_comments.py"
      - "portable_independent_model.py"
      - "race_metadata.py"
      - ".github/workflows/android-fold5.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: >-
          sdkmanager
          "platforms;android-35"
          "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare shared Python sources
        run: >-
          python
          android-fold5/tools/prepare_python_sources.py

      - name: Unit test
        run: >-
          gradle
          -p android-fold5
          :app:testDebugUnitTest
          --stacktrace

      - name: Lint
        run: >-
          gradle
          -p android-fold5
          :app:lintDebug
          --stacktrace

      - name: Build debug APK
        run: >-
          gradle
          -p android-fold5
          :app:assembleDebug
          --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keirin-ai-fold5-debug
          path: >-
            android-fold5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
