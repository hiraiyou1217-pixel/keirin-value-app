name: Android Fold5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-fold5/**"
      - "independent_learning_features.py"
      - "lineup_from_comments.py"
      - "portable_independent_model.py"
      - "race_metadata.py"
      - ".github/workflows/android-fold5.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: >-
          sdkmanager
          "platforms;android-35"
          "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare shared Python sources
        run: >-
          python
          android-fold5/tools/prepare_python_sources.py

      - name: Prepare stable APK signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: >-
            ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_SIGNING_KEYSTORE_BASE64:?GitHub Secret ANDROID_SIGNING_KEYSTORE_BASE64 is required}"
          KEYSTORE_PATH="$RUNNER_TEMP/keirin-ai-release.p12"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" \
            >> "$GITHUB_ENV"

      - name: Unit test
        run: >-
          gradle
          -p android-fold5
          :app:testDebugUnitTest
          --stacktrace

      - name: Lint
        run: >-
          gradle
          -p android-fold5
          :app:lintDebug
          --stacktrace

      - name: Build stable signed APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: >-
            ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: >-
            ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: >-
            ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >-
          gradle
          -p android-fold5
          :app:verifyStableSigning
          :app:assembleRelease
          --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keirin-ai-fold5-release
          path: >-
            android-fold5/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
